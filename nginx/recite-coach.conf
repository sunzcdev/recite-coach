# Oracle VPS — recite.coach 后端网关
# 2026-09-08 初版：仅 logcat 反代，后续服务按需加 server block

# LogCat 日志收集服务（默认兜底）
# 主机 80 口被 Docker 容器占用，后端服务统一走 8080
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # 日志
    access_log /var/log/nginx/logcat.access.log;
    error_log /var/log/nginx/logcat.error.log;

    # 反代到本地 FastAPI
    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 健康检查（不记录日志）
    location /health {
        proxy_pass http://127.0.0.1:9100/health;
        access_log off;
    }
}
